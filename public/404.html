<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Quiniela</title>
    <!--
      GitHub Pages sirve este 404.html para cualquier ruta que no exista como
      archivo físico (p.ej. /Quiniela/historico) — lo redirige a la raíz de
      la app codificando la ruta real en la query string; index.html la
      restaura con history.replaceState antes de montar React Router.
      pathSegmentsToKeep = 1 porque el sitio vive en /Quiniela/ (un único
      segmento de ruta antes de las rutas internas de la app). Patrón
      estándar: rafgraph/spa-github-pages.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
