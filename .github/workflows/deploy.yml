name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # --base=/Quiniela/ sobrescribe el "/quiniela/" que vite.config.ts usa
      # por defecto para el despliegue dentro de GalbaHUB: aquí el sitio vive
      # en https://<usuario>.github.io/Quiniela/, con mayúscula porque así
      # se llama el repo. VITE_SUPABASE_* son públicas por diseño (acaban en
      # el bundle del cliente igualmente), pero se inyectan como secret para
      # no tenerlas escritas en texto plano en este archivo.
      - run: npm run build -- --base=/Quiniela/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
