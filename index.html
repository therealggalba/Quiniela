<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quiniela</title>
    <!--
      GitHub Pages sirve archivos estáticos: no sabe resolver rutas internas
      de la SPA (p.ej. /historico) si se entra directamente por ahí, así que
      public/404.html redirige a aquí codificando la ruta real en la query
      string, y este script la restaura con history.replaceState antes de
      que React Router monte. En GalbaHub/Vercel (que sí sabe reescribir
      cualquier ruta a index.html) esta condición nunca se cumple, así que
      no afecta a ese despliegue. Patrón estándar: rafgraph/spa-github-pages.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <!--
      Guardián de arranque (ES5 a propósito: debe poder ejecutarse en navegadores
      que no entienden el bundle). Sin él, un fallo al cargar/interpretar la app
      deja la página en blanco sin explicación:
      - error al cargar un asset (caché de index.html obsoleta tras un
        despliegue): recarga una sola vez para traer la versión nueva;
      - cualquier otro error antes de que React monte, o app que no monta en
        8 s: muestra un mensaje legible con el detalle técnico.
    -->
    <script type="text/javascript">
      (function () {
        var lastError = '';
        function mounted() {
          var r = document.getElementById('root');
          return !r || r.childNodes.length > 0;
        }
        function show(extra) {
          var r = document.getElementById('root');
          if (!r || r.childNodes.length > 0) return;
          var box = document.createElement('div');
          box.style.cssText = 'padding:2rem 1rem;font-family:sans-serif;line-height:1.4;word-break:break-word';
          box.innerHTML =
            '<p style="font-weight:700">No se ha podido cargar la Quiniela.</p>' +
            '<p>Prueba a recargar. Si tu móvil o navegador es antiguo, actualízalo o abre el enlace con Chrome/Firefox actualizados. ' +
            'Si sigue igual, envía una captura de este mensaje.</p>' +
            '<p style="font-size:12px;opacity:.7"></p>' +
            '<button type="button" style="padding:.5rem 1rem" onclick="location.reload()">Recargar</button>';
          box.getElementsByTagName('p')[2].appendChild(
            document.createTextNode((extra || lastError || 'sin detalle') + ' | ' + navigator.userAgent)
          );
          r.appendChild(box);
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && t !== window) {
              // Error de carga de un recurso. Solo importan scripts y CSS; un escudo
              // (img) que no carga no debe disparar nada.
              if (t.tagName === 'SCRIPT' || t.tagName === 'LINK') {
                lastError = 'No se pudo cargar ' + (t.src || t.href);
                try {
                  if (!sessionStorage.getItem('quiniela_reloaded')) {
                    sessionStorage.setItem('quiniela_reloaded', '1');
                    location.reload();
                    return;
                  }
                } catch (err) {}
                show();
              }
              return;
            }
            lastError = (e.message || 'Error') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '');
            window.setTimeout(function () {
              if (!mounted()) show();
            }, 0);
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          lastError = 'Promesa rechazada: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
        });
        window.setTimeout(function () {
          if (!mounted()) {
            show('La app no arrancó en 8 s. ' + lastError);
            return;
          }
          try {
            sessionStorage.removeItem('quiniela_reloaded');
          } catch (err) {}
        }, 8000);
      })();
    </script>
    <script nomodule>
      window.setTimeout(function () {
        var r = document.getElementById('root');
        if (r) r.innerHTML = '<p style="padding:2rem 1rem;font-family:sans-serif">Tu navegador es demasiado antiguo para esta aplicación. Actualízalo o abre el enlace con Chrome/Firefox actualizados.</p>';
      }, 0);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
